<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="icon-bg-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0056D2"/>
      <stop offset="45%" stop-color="#004098"/>
      <stop offset="100%" stop-color="#002456"/>
    </linearGradient>
    <linearGradient id="gold-accent-512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>
    <linearGradient id="metal-grille" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow-512" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#001433" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Base with Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#icon-bg-512)"/>
  
  <!-- Subtle decorative circular patterns -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="2"/>

  <!-- Bus Main Shadow & Body Group -->
  <g filter="url(#shadow-512)">
    <!-- Bus Outer Shell -->
    <rect x="96" y="100" width="320" height="280" rx="52" fill="#FFFFFF"/>
    
    <!-- Roof Destination Display Panel -->
    <rect x="156" y="116" width="200" height="32" rx="10" fill="#0F172A"/>
    <rect x="174" y="123" width="164" height="18" rx="6" fill="url(#gold-accent-512)"/>
    <text x="256" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3">YOKOHAMA BUS</text>

    <!-- Windshield with Deep Blue -->
    <rect x="118" y="160" width="276" height="112" rx="26" fill="#002D6C"/>
    
    <!-- Windshield Reflection -->
    <path d="M 124 170 L 210 170 L 166 262 L 124 262 Z" fill="#FFFFFF" fill-opacity="0.15"/>
    <circle cx="256" cy="214" r="8" fill="#FFFFFF" fill-opacity="0.25"/>
    <!-- Rear-view mirror hint -->
    <rect x="110" y="200" width="8" height="24" rx="4" fill="#64748B"/>
    <rect x="394" y="200" width="8" height="24" rx="4" fill="#64748B"/>

    <!-- Grille & Center Band -->
    <rect x="138" y="286" width="236" height="32" rx="16" fill="url(#metal-grille)"/>
    <rect x="180" y="296" width="152" height="12" rx="6" fill="#004098"/>
    
    <!-- Emblem Star / Y Mark in Center -->
    <circle cx="256" cy="302" r="8" fill="#FF9800"/>

    <!-- Headlights (Left & Right pairs) -->
    <!-- Left Main Headlight -->
    <circle cx="138" cy="336" r="20" fill="url(#gold-accent-512)"/>
    <circle cx="138" cy="336" r="12" fill="#FFFDE7"/>
    <!-- Right Main Headlight -->
    <circle cx="374" cy="336" r="20" fill="url(#gold-accent-512)"/>
    <circle cx="374" cy="336" r="12" fill="#FFFDE7"/>

    <!-- Bumper -->
    <rect x="122" y="362" width="268" height="20" rx="10" fill="#334155"/>
  </g>

  <!-- Wheels / Suspension Base -->
  <rect x="118" y="380" width="58" height="36" rx="14" fill="#0F172A"/>
  <rect x="336" y="380" width="58" height="36" rx="14" fill="#0F172A"/>
  <rect x="128" y="390" width="38" height="16" rx="6" fill="#334155"/>
  <rect x="346" y="390" width="38" height="16" rx="6" fill="#334155"/>

  <!-- Fast Transit Pulse Indicator Badge (Top Right) -->
  <g transform="translate(360, 60)">
    <circle cx="36" cy="36" r="36" fill="#FF9800" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Lightning / Transit Pulse symbol -->
    <path d="M 38 16 L 24 38 L 36 38 L 32 56 L 50 32 L 38 32 Z" fill="#FFFFFF"/>
  </g>
</svg>
